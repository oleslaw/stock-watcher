name: stock-watch

on:
  schedule:
    # Every 30 min, UK daytime only (07-21 UTC). Stock is listed during the
    # owner's working day, so overnight checks would only burn ScraperAPI
    # credits: 1 URL x 30 runs/day ~= 900 credits/month, inside the free tier.
    - cron: "*/30 7-21 * * *"
  workflow_dispatch:
    inputs:
      self_test:
        description: "Send a test alert using a real in-stock product"
        type: boolean
        default: false

# If a run somehow overlaps the next tick, let the newer one win.
concurrency:
  group: stock-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships python3, and the script is stdlib-only.
      - name: Check stock
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCH_URLS: ${{ secrets.WATCH_URLS }}
          WATCH_SELF_TEST_URLS: ${{ secrets.WATCH_SELF_TEST_URLS }}
          WATCH_HOMEPAGE: ${{ secrets.WATCH_HOMEPAGE }}
          WANTED_PATTERN: ${{ secrets.WANTED_PATTERN }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        # Scheduled runs no-op until ScraperAPI credits renew, so the cron can
        # stay armed without spending anything. Manual runs are never gated.
        # `inputs` is empty on schedule runs, so this collapses to a plain check.
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && "$(date -u +%F)" < "2026-09-28" ]]; then
            echo "credits renew 2026-09-28, skipping"; exit 0
          fi
          python3 stock_watcher.py ${{ inputs.self_test && '--self-test' || '' }}
